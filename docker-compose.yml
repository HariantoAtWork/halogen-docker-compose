#     command: ["/usr/local/bin/halogen-fabric-clock", "hold"]
#     volumes:
#       - /sys:/host/sys
      
  halogen:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.18.9
    container_name: halogen
    restart: unless-stopped
#     depends_on:
#       fabric-clock:
#         condition: service_completed_successfully
    ports:
      - "8731:8731"
    privileged: true
    devices:
      - /dev/kfd
      - /dev/dri
      - /dev/accel/accel0
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    stop_grace_period: 60s
    environment:
#       HALOGEN_DOWNLOAD: Quat3rnion/halogen-qwen3.8-flash-next-v2-abliterated
      HALOGEN_DOWNLOAD: peonist-ai/halogen-qwen3.8-flash-next
      HALOGEN_NPU_MODELS: >-
        decider-0.8b,qwen3-embedding-0.6b,qwen3-reranker-0.6b,qwen3guard-gen-0.6b,qwen3.5-2b
    volumes:
      - ./models:/models
      - /opt/xilinx:/opt/xilinx:ro
      - /sys:/host/sys